slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # Frames
    map_frame: map
    odom_frame: odom
    base_frame: base_link

    # Laser
    scan_topic: /lidar/scan

    # Mapping mode
    mode: mapping

    # Important: publish the map->odom TF
    transform_publish_period: 0.02

    # Reasonable starters
    map_update_interval: 1.0
    resolution: 0.05
    max_laser_range: 30.0
    minimum_time_interval: 0.0
    transform_timeout: 0.2
    tf_buffer_duration: 20.0
    throttle_scans: 1
    scan_queue_size: 50

